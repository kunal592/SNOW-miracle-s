version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: snow-postgres
    environment:
      POSTGRES_USER: snow
      POSTGRES_PASSWORD: snow
      POSTGRES_DB: snow_dev
    ports:
      - "5434:5432"
    volumes:
      - snow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snow -d snow_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: snow-redis
    ports:
      - "6382:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Uncomment when you want to run the API in Docker too:
  # api:
  #   build: ./backend
  #   container_name: snow-api
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   env_file:
  #     - ./backend/.env
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - ./backend:/app
  #   working_dir: /app
  #   command: go run ./cmd/server

volumes:
  snow_pg_data:
